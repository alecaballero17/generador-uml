plugins { id 'com.android.application' }
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
android {
 namespace 'com.generadoruml.mobile'
 compileSdk 34
 defaultConfig { applicationId 'com.generadoruml.mobile'; minSdk 26; targetSdk 34; versionCode 1; versionName '0.1-prueba' }
 androidResources { noCompress 'onnx', 'wasm', 'gz' }
}
dependencies { implementation 'androidx.webkit:webkit:1.10.0' }
dependencies { implementation platform('com.google.firebase:firebase-bom:33.7.0'); implementation 'com.google.firebase:firebase-messaging' }
